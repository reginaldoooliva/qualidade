services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    entrypoint: ["/app/entrypoint.sh"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "5173:5173"
    restart: unless-stopped
